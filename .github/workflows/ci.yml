name: Ceritexa CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test
      - run: |
          test -f AI_START_HERE.md && test -f PHASE.md && test -f CHANGELOG.md
          if git ls-files | grep -E '(^|/)(\.dev\.vars|\.env|credentials\.json)$'; then echo "Secrets file tracked"; exit 1; fi
