name: Ceritexa CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile tools/render_video.py tests/smoke.py

      - name: Read-only Cloudflare HTTP smoke (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        env:
          CERITEXA_WORKER_URL: https://ceritexa-content-agent.finchat-ai-gateway.workers.dev
          CERITEXA_ADMIN_TOKEN: ${{ secrets.CERITEXA_ADMIN_TOKEN }}
        run: python tests/smoke.py
      - run: |
          test -f AI_START_HERE.md && test -f PHASE.md && test -f CHANGELOG.md
          if git ls-files | grep -E '(^|/)(\.dev\.vars|\.env|credentials\.json)$'; then echo "Secrets file tracked"; exit 1; fi
