name: Ceritexa Video Renderer (drafts only)
on:
  workflow_dispatch:
  # A renderer fix may immediately process an already BLOCKED draft, without publishing.
  push:
    branches: [main]
    paths:
      - 'tools/render_video.py'
      - '.github/workflows/render-video.yml'
  schedule:
    - cron: "20 */6 * * *"
permissions:
  contents: read
concurrency:
  group: ceritexa-video-renderer
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify renderer code (no live accounts)
        run: |
          python -m py_compile tools/render_video.py
          python tools/render_video.py --self-test
      - name: Validate Ceritexa GitHub secret
        env:
          CERITEXA_ADMIN_TOKEN: ${{ secrets.CERITEXA_ADMIN_TOKEN }}
        shell: bash
        run: |
          if [ ${#CERITEXA_ADMIN_TOKEN} -lt 24 ]; then
            echo "::error::CERITEXA_ADMIN_TOKEN GitHub Actions secret is missing or too short. Compare with ADMIN_TOKEN on the Ceritexa Worker."
            exit 1
          fi
          echo "Ceritexa renderer secret is configured (value not printed)."
      - name: Install FFmpeg cinematic editor and Indonesian neural TTS client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install --disable-pip-version-check "edge-tts>=7,<9"
          ffmpeg -version | head -n 1
          edge-tts --list-voices | grep -E 'id-ID-(Ardi|Gadis)Neural' | head -n 2
          echo "Neural TTS uses an online unofficial Edge endpoint; errors fail closed (no robotic fallback)."

      - name: Render FOUR cinematic scenes, neural narration and verify MP4
        env:
          CERITEXA_WORKER_URL: https://ceritexa-content-agent.finchat-ai-gateway.workers.dev
          CERITEXA_ADMIN_TOKEN: ${{ secrets.CERITEXA_ADMIN_TOKEN }}
          PYTHONUNBUFFERED: "1"
          CERITEXA_VOICE_PANEX: "id-ID-GadisNeural"
          CERITEXA_VOICE_HEROS: "id-ID-ArdiNeural"
        run: |
          python tools/render_video.py
