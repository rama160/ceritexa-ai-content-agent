name = "ceritexa-content-agent"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true
[vars]
ALLOW_DAILY_DRAFTS = "false"
ALLOW_PUBLICATION = "false"
MONTHLY_DRAFT_LIMIT = "24"
[ai]
binding = "AI"
[[d1_databases]]
binding = "DB"
database_name = "ceritexa-content-db"
database_id = "f9c83fdd-43c9-4c12-83af-669f9566be83"
migrations_dir = "migrations"
[[kv_namespaces]]
binding = "MEDIAKV"
id = "cce0e39dfbb44447a35b76039908bce5"
# R2 deliberately omitted: account reports R2 not enabled. MEDIAKV is isolated fallback.
[triggers]
crons = ["0 0 * * *", "*/15 * * * *"]
